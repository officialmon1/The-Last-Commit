<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Panda companion">
  <!-- bamboo stalk, held in the raised paw -->
  <g transform="rotate(18 150 95)">
    <rect x="145" y="30" width="12" height="118" rx="6" fill="#5fae6b" stroke="#2f5545" stroke-width="2.5"/>
    <rect x="143" y="58" width="16" height="6" rx="3" fill="#3f8f57"/>
    <rect x="143" y="92" width="16" height="6" rx="3" fill="#3f8f57"/>
    <rect x="143" y="126" width="16" height="6" rx="3" fill="#3f8f57"/>
    <ellipse cx="128" cy="34" rx="16" ry="7" fill="#49bd79" stroke="#2f5545" stroke-width="1.5" transform="rotate(-35 128 34)"/>
    <ellipse cx="150" cy="22" rx="18" ry="7.5" fill="#53c784" stroke="#2f5545" stroke-width="1.5" transform="rotate(-8 150 22)"/>
    <ellipse cx="172" cy="32" rx="16" ry="7" fill="#49bd79" stroke="#2f5545" stroke-width="1.5" transform="rotate(28 172 32)"/>
  </g>

  <!-- back arm (resting) -->
  <ellipse cx="54" cy="163" rx="15" ry="27" fill="#242b27" transform="rotate(-18 54 163)"/>

  <!-- body -->
  <ellipse cx="110" cy="152" rx="70" ry="56" fill="#fbfbf8" stroke="#1f2a24" stroke-width="4"/>
  <ellipse cx="110" cy="162" rx="44" ry="36" fill="#eef4ee" opacity="0.65"/>

  <!-- feet -->
  <ellipse cx="78" cy="200" rx="23" ry="14" fill="#242b27"/>
  <ellipse cx="142" cy="200" rx="23" ry="14" fill="#242b27"/>

  <!-- front arm (raised, gripping the bamboo) -->
  <ellipse cx="163" cy="146" rx="16" ry="29" fill="#242b27" transform="rotate(30 163 146)"/>
  <circle cx="178" cy="122" r="11" fill="#242b27"/>

  <!-- head -->
  <circle cx="110" cy="80" r="56" fill="#fbfbf8" stroke="#1f2a24" stroke-width="4"/>

  <!-- ears -->
  <circle cx="65" cy="38" r="22" fill="#242b27"/>
  <circle cx="155" cy="38" r="22" fill="#242b27"/>

  <!-- eye patches -->
  <ellipse cx="84" cy="82" rx="20" ry="26" fill="#242b27" transform="rotate(-16 84 82)"/>
  <ellipse cx="136" cy="82" rx="20" ry="26" fill="#242b27" transform="rotate(16 136 82)"/>

  <!-- eyes -->
  <circle cx="87" cy="86" r="9" fill="#ffffff"/>
  <circle cx="133" cy="86" r="9" fill="#ffffff"/>
  <circle cx="89.5" cy="88" r="4.3" fill="#17201c"/>
  <circle cx="130.5" cy="88" r="4.3" fill="#17201c"/>
  <circle cx="91" cy="86.3" r="1.3" fill="#ffffff"/>
  <circle cx="129" cy="86.3" r="1.3" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="72" cy="100" rx="8" ry="5" fill="#ffb3bd" opacity="0.45"/>
  <ellipse cx="148" cy="100" rx="8" ry="5" fill="#ffb3bd" opacity="0.45"/>

  <!-- nose + mouth -->
  <ellipse cx="110" cy="102" rx="7" ry="5" fill="#1f2a24"/>
  <path d="M97 110 Q110 121 123 110" stroke="#1f2a24" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</svg>
